<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasodifiy Son Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #000000, #434343, #666666, #ffffff);
        background-size: 400% 400%;
        animation: gradientBG 8s ease infinite;
    }

    @keyframes gradientBG {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }

    /* Loader Wrapper */
    .loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
        flex-direction: column;
    }

    .loader-container {
        position: relative;
        width: 160px;
        height: 160px;
    }

    .loader-container img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 4px solid #fff;
        z-index: 10;
    }

    .spinner {
        width: 160px;
        height: 160px;
        border: 8px solid rgba(255, 255, 255, 0.1);
        border-top: 8px solid #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        position: absolute;
        top: 0;
        left: 0;
        box-sizing: border-box;
    }

    @keyframes spin {
        0% { transform: rotate(0deg);}
        100% { transform: rotate(360deg);}
    }

    .container {
        text-align: center;
        background: rgba(33, 42, 52, 0.95);
        color: #fff;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        width: 400px;
        animation: containerPulse 3s infinite alternate;
        display: none;
        opacity: 0;
        transition: opacity 0.8s ease;
    }

    @keyframes containerPulse {
        from { transform: scale(1); box-shadow: 0 15px 35px rgba(0,0,0,0.6);}
        to { transform: scale(1.02); box-shadow: 0 20px 45px rgba(255,255,255,0.1);}
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
    }

    .header img {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #fff;
        transition: transform 0.6s ease;
    }

    .header img:hover {
        transform: rotate(15deg) scale(1.15);
    }

    h1 {
        font-size: 32px;
        margin-bottom: 20px;
        background: linear-gradient(90deg, #fff, #fff, #fff);
        background-clip: text;
        -webkit-background-clip: text;
        animation: textShine 4s infinite linear;
        color: grey;
    }

    @keyframes textShine {
        0% { background-position: 0%;}
        100% { background-position: 200%;}
    }

    input, button {
        padding: 12px 15px;
        margin: 10px;
        font-size: 18px;
        border-radius: 10px;
        border: 2px solid #fff;
        outline: none;
        transition: all 0.3s ease;
    }

    input {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        text-align: center;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    input[type=number] {
        -moz-appearance: textfield;
        appearance: none;
    }

    button {
        background: linear-gradient(45deg, #000000, #ffffff);
        background-size: 300% 300%;
        color: #000;
        font-weight: bold;
        box-shadow: 0 5px 15px rgba(255,255,255,0.3);
        animation: buttonPulse 2.5s infinite alternate;
        transition: 0.4s;
    }

    @keyframes buttonPulse {
        0% {transform: scale(1); box-shadow: 0 5px 15px rgba(255,255,255,0.3);}
        100% {transform: scale(1.05); box-shadow: 0 8px 25px rgba(255,255,255,0.5);}
    }

    button:hover {
        background-position: 100% 0;
        transform: scale(1.1) rotate(1deg);
        cursor: pointer;
    }

    button:active {
        transform: scale(0.95);
        box-shadow: 0 3px 10px rgba(255,255,255,0.2);
    }

    #result {
        margin-top: 25px;
        font-size: 32px;
        font-weight: bold;
        color: #fff;
    }

    @keyframes fadeInResult {
        0% { opacity: 0; transform: scale(0.3) rotate(-10deg);}
        100% { opacity: 1; transform: scale(1) rotate(0deg);}
    }

    @keyframes neonGlow {
        0% { text-shadow: 0 0 5px #fff, 0 0 10px #ccc; }
        50% { text-shadow: 0 0 15px #fff, 0 0 30px #aaa; }
        100% { text-shadow: 0 0 5px #fff, 0 0 10px #ccc; }
    }
</style>
</head>
<body>
    <!-- Loader + Rasm -->
    <div class="loader-wrapper">
        <div class="loader-container">
            <div class="spinner"></div>
            <img src="/photo_2025-08-27_13-52-51.jpg" alt="Profil rasmi">
        </div>
    </div>

    <!-- Card -->
    <div class="container" id="captureArea">
        <div class="header">
            <img src="/photo_2025-08-27_13-52-51.jpg" alt="Profil rasmi">
            <h4>𝕊𝕡𝕖𝕒𝕜𝕚𝕟𝕘 𝕫𝕠𝕟𝕖.</h4>
        </div>
        <h1>🎲 blokdan chiqaring😉</h1>
        <div>
            <input type="number" id="min" placeholder="Minimal son">
            <input type="number" id="max" placeholder="Maksimal son">
        </div>
        <div>
            <button onclick="takeScreenshot()">📷 Screenshot</button>
            <button onclick="generateRandom()">Generate</button>
        </div>
        <div id="result"></div>
    </div>

<script>
window.addEventListener("load", () => {
    const loaderWrapper = document.querySelector(".loader-wrapper");
    const container = document.querySelector(".container");

    setTimeout(() => {
        loaderWrapper.style.display = "none"; 
        container.style.display = "block"; 
        setTimeout(() => {
            container.style.opacity = "1";
        }, 50);
    }, 2500); 
});

function generateRandom() {
    const min = parseInt(document.getElementById('min').value);
    const max = parseInt(document.getElementById('max').value);
    const resultDiv = document.getElementById('result');

    if (isNaN(min) || isNaN(max) || min >= max) {
        resultDiv.textContent = "Iltimos, to‘g‘ri qiymatlar kiriting!";
        resultDiv.style.animation = "fadeInResult 1s ease forwards, neonGlow 2s infinite alternate";
        return;
    }

    const randomNum = Math.floor(Math.random() * (max - min + 1)) + min;
    resultDiv.textContent = "Tasodifiy son: " + randomNum;

    resultDiv.style.animation = "none";
    void resultDiv.offsetWidth;
    resultDiv.style.animation = "fadeInResult 1s ease forwards, neonGlow 2s infinite alternate";
}

function takeScreenshot() {
    const captureArea = document.getElementById('captureArea');
    html2canvas(captureArea).then(canvas => {
        const link = document.createElement('a');
        link.download = 'screenshot.png';
        link.href = canvas.toDataURL();
        link.click();
    });
}
</script>
</body>
</html>
