    <!DOCTYPE html>
    <html lang="uz">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tasodifiy Son Generator — Ko'p animatsiyalar</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
    :root{
        --bg1: #0f172a;
        --bg2: #001219;
        --accent-a: #00ffe5;
        --accent-b: #7b61ff;
        --glass-dark: rgba(20,27,38,0.85);
        --glass-light: rgba(255,255,255,0.92);
    }

    /* Basic */
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter, "Segoe UI", Arial, sans-serif;overflow:hidden}
    body{
        display:flex;
        align-items:center;
        justify-content:center;
        background: linear-gradient(120deg,#071029 0%, #0b1a2b 25%, #112a3d 50%, #052634 75%);
        background-size: 300% 300%;
        animation: bgShift 18s linear infinite, subtleNoise 6s ease-in-out infinite;
        color:#e6eef6;
        transition: background 0.6s ease, color 0.6s ease;
    }

    /* DARK / LIGHT classes switchable on body */
    body.light-mode{
        background: linear-gradient(120deg,#ffffff 0%, #f2f6ff 25%, #f6f6f8 50%, #fffafa 75%);
        color:#111827;
    }

    @keyframes bgShift{
        0%{background-position:0% 50%}
        50%{background-position:100% 50%}
        100%{background-position:0% 50%}
    }
    @keyframes subtleNoise{
        0%{filter:brightness(1)}
        50%{filter:brightness(1.02)}
        100%{filter:brightness(1)}
    }

    /* Shooting stars layer */
    .stars, .stars::after { position: absolute; inset:0; pointer-events:none; z-index:1 }
    .star {
        position:absolute;
        width:2px; height:2px; border-radius:50%;
        background:rgba(255,255,255,0.9);
        box-shadow: 0 0 6px rgba(255,255,255,0.8);
        opacity:0;
        transform: translateY(0) translateX(0) rotate(0);
        animation: starFly linear infinite;
    }
    @keyframes starFly {
        0% {opacity:1; transform: translateY(0) translateX(0) rotate(0); filter:blur(0px)}
        70% {opacity:1; transform: translateY(-600px) translateX(400px) rotate(30deg); filter:blur(0)}
        100% {opacity:0; transform: translateY(-700px) translateX(500px) rotate(60deg); filter:blur(2px)}
    }

    /* Floating bubbles background */
    .bubble {
        position: absolute;
        bottom: -180px;
        border-radius: 50%;
        background: rgba(255,255,255,0.04);
        backdrop-filter: blur(0px);
        z-index: 0;
        animation: rise linear infinite;
        pointer-events:none;
    }
    @keyframes rise {
        0% { transform: translateY(0) scale(1); opacity: 0.15; }
        40% { opacity: 0.3; }
        100% { transform: translateY(-1400px) scale(1.6); opacity: 0; }
    }

    /* Big container card */
    .container {
        position: relative;
        z-index: 10;
        width: 420px;
        padding: 34px;
        border-radius: 20px;
        backdrop-filter: blur(6px) saturate(120%);
        box-shadow: 0 14px 50px rgba(3,8,23,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:14px;
        transform-origin:center;
        /* animation stack */
        animation:
        containerFloat 6.5s ease-in-out infinite,
        containerPulse 3.8s ease-in-out infinite,
        containerGlow 12s linear infinite;
    }

    /* container animations */
    @keyframes containerFloat {
        0%{ transform: translateY(0) rotateX(0deg) }
        50%{ transform: translateY(-8px) rotateX(1.2deg) }
        100%{ transform: translateY(0) rotateX(0deg) }
    }
    @keyframes containerPulse {
        0%{ box-shadow: 0 8px 30px rgba(0,0,0,0.45) }
        50%{ box-shadow: 0 30px 80px rgba(0,50,80,0.45) }
        100%{ box-shadow: 0 8px 30px rgba(0,0,0,0.45) }
    }
    @keyframes containerGlow {
        0%{ outline: 0px solid rgba(123,97,255,0.06) }
        50%{ outline: 8px solid rgba(0,255,229,0.03) }
        100%{ outline: 0px solid rgba(123,97,255,0.06) }
    }

    /* header inside container */
    .header{ display:flex; align-items:center; gap:18px; width:100%; justify-content:center }
    .header img{
        width:86px; height:86px; border-radius:50%; object-fit:cover;
        border:3px solid currentColor;
        transition: transform .45s cubic-bezier(.2,.9,.2,1), box-shadow .45s;
        /* IMPORTANT: only hover effect (user requested) */
    }
    .header img:hover{
        transform: rotate(12deg) scale(1.12);
    }
    .header h4{ margin:0; font-weight:600; letter-spacing:1px; opacity:0.9; font-family: "Georgia", serif; }

    h1{ margin:0; font-size:30px; letter-spacing:0.6px; display:block; text-align:center;
        animation: titleColor 8s linear infinite, titleBob 4s ease-in-out infinite; }
    @keyframes titleColor {
        0%{ color:#fff }
        30%{ color: #00ffe5 }
        60%{ color: #ffd86b }
        100%{ color:#fff }
    }
    @keyframes titleBob {
        0%{ transform:translateY(0) }
        50%{ transform:translateY(-6px) }
        100%{ transform:translateY(0) }
    }

    /* inputs & buttons */
    .controls { display:flex; justify-content:center; gap:8px; width:100%; flex-wrap:wrap }
    input[type=number]{
        width:150px;
        padding:12px 14px;
        border-radius:10px;
        border:2px solid rgba(255,255,255,0.06);
        background: rgba(255,255,255,0.02);
        color:inherit;
        font-size:16px;
        transition: transform .25s, box-shadow .35s;
        outline:none;
        position:relative;
    }
    input[type=number]:focus{
        transform: translateY(-4px) scale(1.01);
        box-shadow: 0 10px 30px rgba(0,255,229,0.07), 0 2px 6px rgba(0,0,0,0.5);
        border-color: rgba(0,255,229,0.6);
    }

    .actions{ display:flex; gap:10px; margin-top:6px; flex-wrap:wrap; justify-content:center }
    button{
        padding:10px 16px;
        border-radius:10px;
        font-weight:700;
        border:2px solid rgba(255,255,255,0.06);
        background: linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
        cursor:pointer;
        transform-origin:center;
        transition: transform .25s, box-shadow .25s;
        position:relative;
        overflow:visible;
    }

    /* Multi-layered animated outline for buttons */
    button::before, button::after{
        content:"";
        position:absolute;
        inset: -3px;
        border-radius:12px;
        pointer-events:none;
        opacity:0;
    }
    button::before{
        background: linear-gradient(90deg, rgba(123,97,255,0.12), rgba(0,255,229,0.08));
        filter: blur(10px);
        transform: scale(0.98);
        transition: opacity .3s;
    }
    button::after{
        background: linear-gradient(90deg, red, orange, yellow, green, blue, purple);
        background-size: 600% 100%;
        mask: linear-gradient(#000,#000);
        opacity:0;
        transition: opacity .35s;
        animation: rainbowSlide 3.4s linear infinite;
    }
    @keyframes rainbowSlide{
        0%{background-position:0% 0%}
        100%{background-position:100% 0%}
    }

    button:hover{
        transform: translateY(-6px) scale(1.06) rotate(-1deg);
        box-shadow: 0 14px 40px rgba(0,0,0,0.5), 0 0 30px rgba(123,97,255,0.08);
    }
    button:hover::before{ opacity:1 }
    button:hover::after{ opacity:0.9; filter: blur(0.6px) }

    /* button click micro-anim */
    button:active{ transform: translateY(-2px) scale(.995) rotate(-0.5deg); }

    /* result box */
    #result{
        min-height:44px;
        display:flex;
        align-items:center;
        justify-content:center;
        width:100%;
        margin-top:12px;
        font-size:28px;
        font-weight:800;
        letter-spacing:0.6px;
        transform-origin:center;
        animation: resultBreathe 4s ease-in-out infinite;
        text-shadow: 0 0 8px rgba(255,255,255,0.06);
    }
    @keyframes resultBreathe {
        0%{ transform: translateY(0) rotate(0) scale(1); color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.06) }
        30%{ transform: translateY(-10px) rotate(-5deg) scale(1.06); color: #00ffe5; text-shadow: 0 0 30px rgba(0,255,229,0.25) }
        60%{ transform: translateY(6px) rotate(6deg) scale(1.04); color: #ffd86b; text-shadow: 0 0 28px rgba(255,216,107,0.18) }
        100%{ transform: translateY(0) rotate(0) scale(1); color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.06) }
    }

    /* extra decorative animated halo ring around container */
    .halo {
        position:absolute;
        inset:-26px;
        border-radius:28px;
        pointer-events:none;
        z-index:9;
        filter: blur(24px);
        background: radial-gradient(circle at 10% 20%, rgba(123,97,255,0.12), transparent 8%),
                    radial-gradient(circle at 90% 80%, rgba(0,255,229,0.08), transparent 8%);
        animation: haloRotate 18s linear infinite, haloPulse 6s ease-in-out infinite;
        mix-blend-mode: screen;
    }
    @keyframes haloRotate {
        0%{ transform: rotate(0deg) }
        100%{ transform: rotate(360deg) }
    }
    @keyframes haloPulse {
        0%{ opacity:0.8 }
        50%{ opacity:0.35 }
        100%{ opacity:0.8 }
    }

    /* small decorative lines moving behind container */
    .laser-line {
        position:absolute; inset:0; z-index:2; pointer-events:none;
    }
    .laser-line .line {
        position:absolute; height:2px; width:160%; left:-30%;
        background:linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
        transform:translateY(0) rotate(-6deg);
        animation: sweep 6s linear infinite;
    }
    .laser-line .line.alt { animation-duration:9s; opacity:0.7; transform:rotate(4deg) translateY(20px); }

    @keyframes sweep {
        0%{ transform:translateX(-100%) translateY(0) }
        100%{ transform:translateX(100%) translateY(-120px) }
    }

    /* Loader wrapper (keeps original behavior) */
    .loader-wrapper {
        position: fixed; inset:0; display:flex; align-items:center; justify-content:center;
        background: rgba(3,6,10,0.85); z-index:9999; flex-direction:column;
    }

    .loader-container { position:relative; width:160px; height:160px; display:flex; align-items:center; justify-content:center; }
    .spinner { width:160px; height:160px; border-radius:50%; border:8px solid rgba(255,255,255,0.06); border-top:8px solid rgba(255,255,255,0.9); animation: spin 1.1s linear infinite; }
    @keyframes spin { 0%{transform:rotate(0)}100%{transform:rotate(360deg)} }

    /* small responsive adjustments */
    @media (max-width:480px){
        .container{ width:92%; padding:20px }
        input[type=number]{ width:48% }
        h1{ font-size:22px }
    }
        /* Input chiziqni olib tashlash */
    input[type="number"] {
        border: none;          /* tashqi chiziqni olib tashlaydi */
        outline: none;         /* bosilganda chiqadigan ko‘k chiziqni olib tashlaydi */
        -moz-appearance: textfield; /* Firefox strelkalarni olib tashlash */
    }

    /* Chrome, Safari, Edge dagi strelkalarni olib tashlash */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    </style>
    </head>
    <body class="dark-mode">
  
<div class="container" id="captureArea" style="display:none;">
    <div class="halo"></div>
    <div class="laser-line"><div class="line"></div><div class="line alt"></div></div>


    <div class="header">
        <img src="/photo_2025-08-27_13-52-51.jpg" alt="Profil rasmi">
        <h4>𝕊𝕡𝕖𝕒𝕜𝕚𝕟𝕘 𝕫𝕠𝕟𝕖.</h4>
    </div>

    <h1>🎲 randomjon😉</h1>

    <div class="controls">
        <input type="number" id="min" placeholder="Minimal son">
        <input type="number" id="max" placeholder="Maksimal son">
    </div>

    <div class="actions">
        <button onclick="takeScreenshot()">📷 Screenshot</button>
        <button onclick="generateRandom()">Generate</button>
    </div>

    <div id="result"></div>
</div>
<!-- Dark/Light tugma -->
<button id="modeToggle"
        onclick="toggleMode()" 
        style="position:absolute;top:12px;right:12px;padding:8px 14px;
               border:none;border-radius:8px;cursor:pointer;
               font-weight:600;background:linear-gradient(90deg,#7b61ff,#00ffe5);
               color:#fff;z-index:999;">
    🌙
</button>

    <!-- animated background elements -->
    <div class="stars" aria-hidden="true"></div>
    <div class="bubbles" aria-hidden="true"></div>

    <!-- loader visible on page load -->
    <div class="loader-wrapper" id="loader">
        <div class="loader-container">
        <div class="spinner"></div>
        <img src="/photo_2025-08-27_13-52-51.jpg" alt="Profil rasmi" style="width:100px;height:100px;border-radius:50%;position:absolute;object-fit:cover;border:4px solid #fff;">
        </div>
    </div>

    <!-- Main card -->
    <div class="container" id="captureArea" style="display:none;">
        <div class="halo"></div>
        <div class="laser-line"><div class="line"></div><div class="line alt"></div></div>

        <div class="header">
        <img src="/photo_2025-08-27_13-52-51.jpg" alt="Profil rasmi">
        <h4>𝕊𝕡𝕖𝕒𝕜𝕚𝕟𝕘 𝕫𝕠𝕟𝕖.</h4>
        </div>

        <h1>🎲 randomjon😉</h1>

        <div class="controls">
        <input type="number" id="min" placeholder="Minimal son">
        <input type="number" id="max" placeholder="Maksimal son">
        </div>

        <div class="actions">
        <button onclick="takeScreenshot()">📷 Screenshot</button>
        <button onclick="generateRandom()">Generate</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
    // Show loader then show container (keeps previous behavior)
    window.addEventListener("load", () => {
        const loader = document.getElementById('loader');
        const container = document.getElementById('captureArea');

        // create many background stars with different timings
        const starsLayer = document.querySelector('.stars');
        for(let i=0;i<12;i++){
        const s = document.createElement('div');
        s.className = 'star';
        // randomize starting position near bottom half
        const left = Math.random()*100;
        const top = 60 + Math.random()*35;
        s.style.left = left + 'vw';
        s.style.top = top + 'vh';
        s.style.width = (Math.random()*2+1) + 'px';
        s.style.height = s.style.width;
        const dur = (Math.random()*3+3) + 's';
        s.style.animationDuration = dur;
        s.style.animationDelay = (Math.random()*3) + 's';
        starsLayer.appendChild(s);
        }

        // create floating bubbles
        const bubbles = document.querySelector('.bubbles');
        for(let i=0;i<20;i++){
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = Math.floor(Math.random()*40)+12;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = (Math.random()*110 - 5) + 'vw';
        b.style.bottom = (-Math.random()*200 - 40) + 'px';
        b.style.opacity = (Math.random()*0.25 + 0.06);
        b.style.animationDuration = (Math.random()*12 + 9) + 's';
        b.style.animationDelay = (Math.random()*4) + 's';
        bubbles.appendChild(b);
        }

        // fake "loading" then display
        setTimeout(() => {
        loader.style.display = 'none';
        container.style.display = 'flex';
        container.style.opacity = '0';
        setTimeout(()=>{ container.style.transition='opacity .6s ease'; container.style.opacity='1'; }, 40);
        }, 2000);
    });

    // Random generator
    function generateRandom(){
        const min = parseInt(document.getElementById('min').value);
        const max = parseInt(document.getElementById('max').value);
        const resultDiv = document.getElementById('result');

        if(isNaN(min) || isNaN(max) || min >= max){
        resultDiv.textContent = "Iltimos, to‘g‘ri qiymatlar kiriting!";
        // quick flash for error
        resultDiv.style.animation = 'none';
        void resultDiv.offsetWidth;
        resultDiv.style.animation = 'resultError 1s ease-in-out';
        // create keyframes dynamically for a short error bounce
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes resultError {
            0%{transform:translateY(0) scale(1); color:#ff8a8a}
            40%{transform:translateY(-10px) scale(1.02); color:#ff4d4d}
            100%{transform:translateY(0) scale(1); color:inherit}
            }`;
        document.head.appendChild(style);
        return;
        }

        const randomNum = Math.floor(Math.random() * (max - min + 1)) + min;
        resultDiv.textContent = "Tasodifiy son: " + randomNum;

        // play celebratory micro-animation on result
        resultDiv.style.animation = 'none';
        void resultDiv.offsetWidth;
        resultDiv.style.animation = 'resultPop 900ms cubic-bezier(.2,.9,.2,1)';
        const s = document.createElement('style');
        s.innerHTML = `
        @keyframes resultPop {
            0%{ transform: translateY(0) rotate(0deg) scale(.6); opacity:0 }
            40%{ transform: translateY(-18px) rotate(-6deg) scale(1.12); opacity:1; text-shadow: 0 0 30px rgba(0,255,229,0.25)}
            70%{ transform: translateY(8px) rotate(8deg) scale(1.04); }
            100%{ transform: translateY(0) rotate(0) scale(1); }
        }`;
        document.head.appendChild(s);

        // tiny confetti-like sparkles near result
        spawnSparks();
    }

    function takeScreenshot(){
        const captureArea = document.getElementById('captureArea');
        html2canvas(captureArea, {useCORS:true, scale:2}).then(canvas=>{
        const link = document.createElement('a');
        link.download = 'screenshot.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        });
    }

    // small spark effect (temporary DOM particles)
    function spawnSparks(){
        const container = document.getElementById('captureArea');
        for(let i=0;i<18;i++){
        const p = document.createElement('div');
        p.style.position='absolute';
        p.style.left = (45 + Math.random()*30) + '%';
        p.style.top = (55 + Math.random()*6) + '%';
        p.style.width = p.style.height = (Math.random()*6+4) + 'px';
        p.style.borderRadius='50%';
        p.style.pointerEvents='none';
        p.style.zIndex=9999;
        const hue = Math.floor(Math.random()*360);
        p.style.background = `linear-gradient(90deg,hsl(${hue} 100% 60%), hsl(${(hue+60)%360} 100% 60%))`;
        p.style.opacity=1;
        p.style.transform = `translateY(0) scale(1)`;
        p.style.transition = `transform 700ms cubic-bezier(.2,.9,.2,1), opacity 700ms`;
        container.appendChild(p);
        setTimeout(()=>{ p.style.transform = `translateY(-80px) translateX(${(Math.random()-0.5)*120}px) scale(.3)`; p.style.opacity=0; }, 30 + Math.random()*120);
        setTimeout(()=> p.remove(), 900);
        }
    }

    // simple toggle for dark/light (keeps previous toggle approach if you add button)
    function toggleMode(){
        document.body.classList.toggle('light-mode');
    }
    function toggleMode(){
    document.body.classList.toggle('light-mode');
    const btn = document.getElementById("modeToggle");

    if(document.body.classList.contains("light-mode")){
        btn.textContent = "☀️"; // Light rejim belgisi
    } else {
        btn.textContent = "🌙"; // Dark rejim belgisi
    }
}

    </script>
    </body>
