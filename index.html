<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasodifiy Son Generator</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #000000, #ffffff);
        background-size: 400% 400%;
        animation: gradientBG 10s ease infinite;
    }

    @keyframes gradientBG {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }

    .container {
        text-align: center;
        background: linear-gradient(180deg, #2b3946 0%, #212a34 100%);
        color: #fff;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        width: 380px;
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
    }

    .header img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #fff;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 20px;
    }

    input, button {
        padding: 12px 15px;
        margin: 10px;
        font-size: 18px;
        border-radius: 8px;
        border: 2px solid #000;
        outline: none;
        transition: 0.3s;
    }

    input:hover, button:hover {
        background: #000;
        color: #fff;
        cursor: pointer;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    input[type=number] {
        -moz-appearance: textfield;
    }

    #result {
        margin-top: 25px;
        font-size: 28px;
        font-weight: bold;
        color: #ffeb3b;
        opacity: 0;
        animation: none;
    }

    @keyframes fadeInResult {
        from { opacity: 0; transform: scale(0.5); }
        to { opacity: 1; transform: scale(1); }
    }
</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- Rasmni URL bilan almashtiring yoki o‘z local faylingizni joylashtiring -->
            <img src="/photo_2025-08-27_13-52-51.jpg" alt="Profil rasmi">
            <h4>𝕊𝕡𝕖𝕒𝕜𝕚𝕟𝕘 𝕫𝕠𝕟𝕖.</h4>
        </div>
        <h1>🎲 Tasodifiy son</h1>
        <div>
            <input type="number" id="min" placeholder="Minimal son">
            <input type="number" id="max" placeholder="Maksimal son">
        </div>
        <button onclick="generateRandom()">Generatsiya</button>
        <div id="result"></div>
    </div>

<script>
function generateRandom() {
    const min = parseInt(document.getElementById('min').value);
    const max = parseInt(document.getElementById('max').value);
    const resultDiv = document.getElementById('result');

    if (isNaN(min) || isNaN(max) || min >= max) {
        resultDiv.textContent = "Iltimos, to‘g‘ri qiymatlar kiriting!";
        resultDiv.style.opacity = 1;
        resultDiv.style.animation = "none";
        return;
    }

    const randomNum = Math.floor(Math.random() * (max - min + 1)) + min;
    resultDiv.textContent = "Tasodifiy son: " + randomNum;

    // Animatsiya qo‘llash
    resultDiv.style.animation = "none"; // Reset
    void resultDiv.offsetWidth; // Trigger reflow
    resultDiv.style.animation = "fadeInResult 0.6s ease forwards";
}
</script>
</body>
</html>
